schema_version: 1
name: phase9_dspo_family_validation
tier: formal
run_mode: formal
description: Phase 9 paired DSPO clip/wide validation using the Phase 8 formal-equivalent split and runtime contract.
required_policy_tags:
  - dspo_clip
  - dspo_wide
shared_checkpoint:
  required: true
  path: outputs/shared_training/work2_robust_menu/formal/supervised_ml.pt
  expected_status: loaded
base_args:
  algo_name: DSPO_Menu
  menu_mode: true
  product_mode: m+w+p
  time_window_mode: adaptive_window
  menu_contract_mode: optimized_menu
  menu_pricing_mode: lambertw
  menu_pricing_constant: -3.0
  run_mode: formal
  instance: RC
  load_data: true
  pricing: true
  max_episodes: 1
  max_steps_r: 20
  max_steps_p: 0.7
  n_vehicles: 2
  veh_capacity: 3
  reopt: 10000000
  hgs_reopt_time: 0.1
  hgs_final_time: 0.1
  menu_k: 3
  max_candidates: 8
  menu_exact_threshold: 8
  menu_exact_gap_threshold: 8
  checkpoint_path: outputs/shared_training/work2_robust_menu/formal/supervised_ml.pt
  require_checkpoint: true
  allow_checkpoint_mismatch: false
splits:
  - split_id: phase8_baseline_low_seed0
    seed: 401
    data_seed: 0
    data_seed_test: 1
    uptake_regime: low
    args_overrides:
      home_util: 3.8
      base_util: -2.8
      incentive_sens: -0.18
  - split_id: phase8_baseline_low_seed1
    seed: 402
    data_seed: 1
    data_seed_test: 0
    uptake_regime: low
    args_overrides:
      home_util: 3.8
      base_util: -2.8
      incentive_sens: -0.18
  - split_id: phase8_baseline_medium_seed0
    seed: 403
    data_seed: 0
    data_seed_test: 1
    uptake_regime: medium
    args_overrides:
      home_util: 3.2
      base_util: -2.0
      incentive_sens: -0.25
  - split_id: phase8_baseline_medium_seed1
    seed: 404
    data_seed: 1
    data_seed_test: 0
    uptake_regime: medium
    args_overrides:
      home_util: 3.2
      base_util: -2.0
      incentive_sens: -0.25
  - split_id: phase8_baseline_medium_seed2
    seed: 405
    data_seed: 0
    data_seed_test: 1
    uptake_regime: medium
    args_overrides:
      home_util: 3.2
      base_util: -2.0
      incentive_sens: -0.25
policies:
  - tag: dspo_clip
  - tag: dspo_wide
paired_fields:
  - seed
  - data_seed
  - data_seed_test
  - instance
  - load_data
  - pricing
  - hgs_reopt_time
  - hgs_final_time
  - reopt
  - checkpoint_path
  - require_checkpoint
  - allow_checkpoint_mismatch
  - menu_k
  - max_candidates
  - max_steps_r
  - max_steps_p
  - n_vehicles
  - veh_capacity
  - menu_pricing_constant
  - home_util
  - base_util
  - incentive_sens
varied_fields:
