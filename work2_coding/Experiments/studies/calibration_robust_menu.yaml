schema_version: 1
name: calibration_robust_menu
tier: pilot
run_mode: pilot
description: Pre-registered calibration pilot contract for robust service-menu settings; never final claim evidence.
output_intent: calibration_only
calibration_protocol: ../../.planning/results/CALIBRATION_PROTOCOL.md
required_policy_tags:
  - mainline_no_menu
  - mainline_fixed_menu
  - mainline_random_menu
  - mainline_optimized_m
  - mainline_optimized_mw
  - mainline_optimized_fixed_window
  - mainline_optimized_adaptive
shared_checkpoint:
  required: true
  path: outputs/shared_training/work2_robust_menu/calibration/supervised_ml.pt
  expected_status: loaded
base_args:
  algo_name: DSPO_Menu
  menu_mode: true
  product_mode: m+w+p
  time_window_mode: adaptive_window
  menu_contract_mode: optimized_menu
  menu_pricing_mode: lambertw
  run_mode: pilot
  instance: RC
  load_data: true
  pricing: true
  max_episodes: 5
  max_steps_r: 40
  max_steps_p: 0.55
  reopt: 10000000
  hgs_reopt_time: 0.5
  hgs_final_time: 0.5
  menu_k: 3
  max_candidates: 10
  menu_exact_threshold: 8
  menu_exact_gap_threshold: 8
  checkpoint_path: outputs/shared_training/work2_robust_menu/calibration/supervised_ml.pt
  require_checkpoint: true
  allow_checkpoint_mismatch: false
  menu_eta_filter_mode: interval_overlap
  service_quit_rate_guardrail: 0.35
  menu_optout_guardrail: 0.35
calibration_grid:
  menu_k: [2, 3, 4]
  max_candidates: [8, 10, 12]
  eta_filter_mode: [hard, interval_overlap]
  eta_chance_threshold: [0.20, 0.25]
  service_or_optout_guardrail: [0.35, 0.40]
selection_rule:
  type: pre_registered_multi_metric
  forbids_single_profit_ranking: true
  forbids_final_result_tuning: true
  metrics:
    - net_profit
    - acceptance_rate
    - optout_rate
    - meeting_point_uptake_rate
    - served_rate
splits:
  - split_id: calibration_mainline_low_seed0
    seed: 401
    data_seed: 0
    data_seed_test: 1
    uptake_regime: low
    args_overrides:
      home_util: 3.8
      base_util: -2.8
      incentive_sens: -0.18
  - split_id: calibration_mainline_low_seed1
    seed: 402
    data_seed: 1
    data_seed_test: 0
    uptake_regime: low
    args_overrides:
      home_util: 3.8
      base_util: -2.8
      incentive_sens: -0.18
  - split_id: calibration_mainline_medium_seed0
    seed: 403
    data_seed: 0
    data_seed_test: 1
    uptake_regime: medium
    args_overrides:
      home_util: 3.2
      base_util: -2.0
      incentive_sens: -0.25
  - split_id: calibration_mainline_medium_seed1
    seed: 404
    data_seed: 1
    data_seed_test: 0
    uptake_regime: medium
    args_overrides:
      home_util: 3.2
      base_util: -2.0
      incentive_sens: -0.25
policies:
  - tag: mainline_no_menu
  - tag: mainline_fixed_menu
  - tag: mainline_random_menu
  - tag: mainline_optimized_m
  - tag: mainline_optimized_mw
  - tag: mainline_optimized_fixed_window
  - tag: mainline_optimized_adaptive
paired_fields:
  - seed
  - data_seed
  - data_seed_test
  - instance
  - load_data
  - pricing
  - hgs_reopt_time
  - hgs_final_time
  - reopt
  - checkpoint_path
  - require_checkpoint
  - allow_checkpoint_mismatch
  - menu_k
  - max_candidates
  - max_steps_r
  - max_steps_p
  - home_util
  - base_util
  - incentive_sens
varied_fields:
  - algo_name
  - menu_mode
  - product_mode
  - time_window_mode
  - menu_contract_mode
  - menu_pricing_mode
  - menu_policy
  - menu_eta_filter_mode
  - menu_time_filtering
  - menu_objective_mode
  - menu_eta_chance_threshold
  - menu_eta_soft_penalty_lambda
  - service_quit_penalty
  - service_quit_rate_guardrail
  - menu_outside_penalty_lambda
  - menu_optout_guardrail
  - menu_selection_solver
  - menu_use_exact_eval
output_schema:
  normalized-row-v2: true
  fields:
    - schema_version
    - study_id
    - study_name
    - manifest_path
    - run_id
    - tier
    - run_mode
    - policy_tag
    - candidate_id
    - method
    - method_family
    - product_mode
    - time_window_mode
    - menu_mode
    - pricing_mode
    - method_variant
    - outside_option_util
    - split_id
    - seed
    - data_seed
    - data_seed_test
    - trace_id
    - trace_hash
    - manifest_hash
    - settings_hash
    - checkpoint_load_status
    - checkpoint_path
    - checkpoint_hash
    - checkpoint_required
    - checkpoint_intentional_mismatch
    - pricing
    - hgs_reopt_time
    - hgs_final_time
    - menu_k
    - max_candidates
    - filter_mode
    - effective_policy
    - accepted_count
    - served_count
    - served_rate
    - acceptance_rate
    - optout_rate
    - home_share
    - meeting_point_uptake_rate
    - count_opted_out
    - count_accepted_home
    - count_accepted_meeting_point
    - net_price_revenue
    - net_profit
    - operational_cost
    - total_cost
    - menu_build_time
    - menu_utilization
    - choice_entropy
    - uptake_regime
    - diagnostic
    - comparison_role
    - placeholder_only
    - status
    - execution_status
    - error_type
    - error_message
